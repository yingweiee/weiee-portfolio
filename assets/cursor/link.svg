<svg xmlns="http://www.w3.org/2000/svg" width="18" height="20"
     viewBox="0 0 9 10" shape-rendering="crispEdges">
  <!-- The pointing hand, for anything clickable.

       The fingertip is the single block at the top, in column 3, so the
       hotspot goes there rather than at the corner: what the hand points at
       is what a click will hit.

       Same treatment as pen.svg: a 9x10 block grid redrawn onto a
       9-unit viewBox, so at 18x20 every block is exactly 2 CSS px and
       lands whole at 1x, 1.5x and 2x. The three cursors share that 2px
       cell, which is what keeps them a set rather than three drawings.

       The hotspot is set in the CSS. -->
  <g fill="#EBE8E0">
    <rect x="3" y="1" width="1" height="1"/>
    <rect x="3" y="2" width="1" height="1"/>
    <rect x="3" y="3" width="1" height="1"/>
    <rect x="5" y="3" width="1" height="1"/>
    <rect x="3" y="4" width="1" height="1"/>
    <rect x="5" y="4" width="1" height="1"/>
    <rect x="1" y="5" width="1" height="1"/>
    <rect x="3" y="5" width="3" height="1"/>
    <rect x="7" y="5" width="1" height="1"/>
    <rect x="1" y="6" width="7" height="1"/>
    <rect x="1" y="7" width="7" height="1"/>
    <rect x="2" y="8" width="5" height="1"/>
  </g>
  <g fill="#484235">
    <rect x="3" y="0" width="1" height="1"/>
    <rect x="2" y="1" width="1" height="1"/>
    <rect x="4" y="1" width="1" height="1"/>
    <rect x="2" y="2" width="1" height="1"/>
    <rect x="4" y="2" width="2" height="1"/>
    <rect x="2" y="3" width="1" height="1"/>
    <rect x="4" y="3" width="1" height="1"/>
    <rect x="6" y="3" width="1" height="1"/>
    <rect x="1" y="4" width="2" height="1"/>
    <rect x="4" y="4" width="1" height="1"/>
    <rect x="6" y="4" width="2" height="1"/>
    <rect x="0" y="5" width="1" height="1"/>
    <rect x="2" y="5" width="1" height="1"/>
    <rect x="6" y="5" width="1" height="1"/>
    <rect x="8" y="5" width="1" height="1"/>
    <rect x="0" y="6" width="1" height="1"/>
    <rect x="8" y="6" width="1" height="1"/>
    <rect x="0" y="7" width="1" height="1"/>
    <rect x="8" y="7" width="1" height="1"/>
    <rect x="1" y="8" width="1" height="1"/>
    <rect x="7" y="8" width="1" height="1"/>
    <rect x="2" y="9" width="5" height="1"/>
  </g>
</svg>
